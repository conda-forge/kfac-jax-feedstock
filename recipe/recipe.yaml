schema_version: 1

context:
  name: kfac-jax
  version: "0.0.8"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 7a95d2081af2319f1314abaec5b808151923c10f5499400f49dead1f01c058cb

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - typing_extensions >=4.0.0
    - python >=${{ python_min }}
    - absl-py >=0.12.0
    - immutabledict >=2.2.1
    - numpy >=1.22
    - distrax >=0.1.3
    - jax >=0.4.27
    - jaxlib >=0.4.27
    - dm-tree >=0.1.7
    - optax >=0.1.4
    - typing-extensions >=4.2.0
    - tensorflow-estimator

tests:
  - python:
      imports:
        - kfac_jax
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: A Jax package for approximate curvature estimation and optimization using KFAC.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/deepmind/kfac-jax

extra:
  recipe-maintainers:
    - jan-janssen
